name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Lint, tests, build and Prisma
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: livecast
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: livecast_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U livecast -d livecast_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4-bookworm
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://livecast:ci-only-password@localhost:5432/livecast_test
      TEST_DATABASE_URL: postgresql://livecast:ci-only-password@localhost:5432/livecast_test
      TEST_REDIS_URL: redis://localhost:6379/15
      AUTH_RATE_LIMIT: 10000
      FRONTEND_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run db:validate --workspace @streamline/server
      - run: npm run db:generate --workspace @streamline/server
      - run: npm run db:deploy --workspace @streamline/server
      - name: Verify repeatable migrations
        run: npm run db:deploy --workspace @streamline/server
      - name: Verify migration/schema agreement
        working-directory: apps/server
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - run: npm run lint
      - run: npm test
      - run: npm run build --workspace web -- --webpack
  containers:
    name: Production containers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - run: docker build -f apps/server/Dockerfile -t livecast-api:ci .
      - run: docker build -f apps/web/Dockerfile -t livecast-web:ci .
