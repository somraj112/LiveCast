name: livecast-dev
services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: livecast
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: livecast_dev
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U livecast -d livecast_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7.4-bookworm
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
